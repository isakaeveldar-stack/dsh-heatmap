name: heatmap digest

# Every 15 minutes: scan the top USDT perps, rank the liquidation imbalance and
# send the top 5 to Telegram. Requires repository secrets:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (mandatory)
#   CG_API_KEY, COINANK_API_KEY (optional, switch the source to paid heatmaps)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: heatmap
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan and send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CG_API_KEY: ${{ secrets.CG_API_KEY }}
          COINANK_API_KEY: ${{ secrets.COINANK_API_KEY }}
        run: node tools/heatmap.mjs --once --top 40 --digest 5 --quiet

      - name: Keep the snapshot as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: heatmap-${{ github.run_id }}
          path: data/heatmaps/*.json
          retention-days: 30
          if-no-files-found: ignore
