name: refresh universe

# Weekly: rebuild data/universe.json (top USDT perps by 24h volume) and commit it,
# so the 15-minute digest run stays fast.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild universe
        run: node tools/update-universe.mjs --limit 100

      - name: Commit
        run: |
          git config user.name "dsh-bot"
          git config user.email "dsh-bot@users.noreply.github.com"
          git add data/universe.json
          git diff --cached --quiet || git commit -m "chore: refresh universe"
          git push
